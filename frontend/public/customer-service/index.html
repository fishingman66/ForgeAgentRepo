<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>在线客服</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f6f7f9; color: #1f2937; }
  .wrap { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 14px; background: #2563eb; color: #fff; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  header button { border: 1px solid rgba(255,255,255,.6); background: transparent; color: #fff; border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 12px; }
  .row { display: flex; margin-bottom: 10px; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 8px 11px; border-radius: 10px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .row.me .bubble { background: #2563eb; color: #fff; }
  .row:not(.me) .bubble { background: #fff; border: 1px solid #e5e7eb; }
  .tip { text-align: center; font-size: 12px; color: #6b7280; margin: 6px 0; }
  .bar { border-top: 1px solid #e5e7eb; background: #fff; padding: 8px; }
  .bar textarea { width: 100%; height: 56px; resize: none; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px; font-size: 13px; }
  .actions { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .actions button { border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .actions .send { margin-left: auto; background: #2563eb; border-color: #2563eb; color: #fff; }
  .rate { display: none; gap: 4px; align-items: center; margin-top: 6px; font-size: 12px; }
  .rate button { border: 1px solid #d1d5db; background: #fff; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  .status { font-size: 11px; color: #6b7280; padding: 0 14px 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header><span id="title">在线客服</span><button id="reset" type="button">新会话</button></header>
  <div class="status" id="status">正在连接…</div>
  <div id="log"></div>
  <div class="bar">
    <textarea id="input" placeholder="输入你的问题"></textarea>
    <div class="actions">
      <button id="handoff" type="button">转人工</button>
      <button id="rateToggle" type="button">评价</button>
      <button class="send" id="send" type="button">发送</button>
    </div>
    <div class="rate" id="rateBox"><span>本次服务评分</span><span id="stars"></span></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var qs = new URLSearchParams(location.search);
  var channel = qs.get('channel') || 'default';
  var base = qs.get('base') || '';
  document.getElementById('title').textContent = qs.get('title') || '在线客服';

  var log = document.getElementById('log');
  var statusEl = document.getElementById('status');
  var input = document.getElementById('input');
  var visitorKey = 'forge_cs_visitor_' + channel;
  var visitorId = localStorage.getItem(visitorKey);
  if (!visitorId) {
    visitorId = 'web-' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    localStorage.setItem(visitorKey, visitorId);
  }
  var token = '';
  var conversationId = 0;
  var cursor = 0;
  var busy = false;

  function uuid() {
    return window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'm-' + Date.now() + '-' + Math.random();
  }
  function add(role, text) {
    var row = document.createElement('div');
    row.className = 'row' + (role === 'me' ? ' me' : '');
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }
  function tip(text) {
    var div = document.createElement('div');
    div.className = 'tip';
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  function request(path, method, body, withToken) {
    var headers = { 'Content-Type': 'application/json' };
    if (withToken && token) headers['X-Visitor-Token'] = token;
    return fetch(base + path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (r.code !== 200) throw new Error(r.msg || '请求失败');
        return r.data;
      });
  }
  function openSession() {
    statusEl.textContent = '正在连接…';
    return request('/chat-api/' + encodeURIComponent(channel) + '/sessions', 'POST', { externalUserId: visitorId })
      .then(function (data) {
        token = data.visitorToken;
        conversationId = data.conversationId;
        statusEl.textContent = data.reused ? '已恢复上次会话' : '已连接';
        cursor = 0;
        poll();
      })
      .catch(function (e) { statusEl.textContent = '连接失败: ' + e.message; });
  }
  function poll() {
    if (!conversationId || !token) return;
    request('/chat-api/' + encodeURIComponent(channel) + '/sessions/' + conversationId + '/events?after=' + cursor,
      'GET', null, true)
      .then(function (list) {
        (list || []).forEach(function (ev) {
          cursor = Math.max(cursor, Number(ev.id) || 0);
          if (ev.event === 'cs_ticket_new' || ev.event === 'cs_handoff') tip('已为你转接人工客服');
          if (ev.event === 'cs_queue_position') tip('正在排队等待坐席接入');
          if (ev.event === 'cs_csat_invite') { document.getElementById('rateBox').style.display = 'flex'; }
        });
      })
      .catch(function () { /* 轮询失败不影响聊天,下次继续 */ });
  }
  function send(text, clientMsgId, attempt) {
    return request('/chat-api/' + encodeURIComponent(channel) + '/sessions/' + conversationId + '/messages',
      'POST', { clientMsgId: clientMsgId, content: text }, true)
      .then(function (data) {
        if (!data.reused) add('bot', data.content || '（无回复）');
        if (data.fallback) tip('未找到答案，已记录知识缺口');
        if (data.handoff) tip('已为你转接人工客服');
        statusEl.textContent = '已连接';
      })
      .catch(function (e) {
        if (attempt < 3) {
          statusEl.textContent = '网络不稳定，正在重试…';
          return new Promise(function (resolve) { setTimeout(resolve, 500 * (attempt + 1)); })
            .then(function () { return send(text, clientMsgId, attempt + 1); });
        }
        statusEl.textContent = '发送失败: ' + e.message;
      });
  }
  document.getElementById('send').addEventListener('click', function () {
    var text = input.value.trim();
    if (!text || busy || !conversationId) return;
    busy = true;
    add('me', text);
    input.value = '';
    send(text, uuid(), 1).then(function () { busy = false; });
  });
  document.getElementById('handoff').addEventListener('click', function () {
    if (!conversationId) return;
    request('/chat-api/' + encodeURIComponent(channel) + '/sessions/' + conversationId + '/handoff',
      'POST', { reason: 'visitor_request' }, true)
      .then(function () { tip('已提交转人工请求'); })
      .catch(function (e) { tip('转人工失败: ' + e.message); });
  });
  document.getElementById('reset').addEventListener('click', function () {
    log.innerHTML = '';
    cursor = 0;
    openSession();
  });
  document.getElementById('rateToggle').addEventListener('click', function () {
    var box = document.getElementById('rateBox');
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
  });
  var stars = document.getElementById('stars');
  for (var i = 1; i <= 5; i++) {
    (function (score) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = score + '分';
      btn.addEventListener('click', function () {
        request('/chat-api/' + encodeURIComponent(channel) + '/sessions/' + conversationId + '/csat',
          'POST', { score: score, tags: 'web' }, true)
          .then(function () { tip('谢谢你的评价'); })
          .catch(function (e) { tip('评价失败: ' + e.message); });
      });
      stars.appendChild(btn);
    })(i);
  }
  setInterval(poll, 5000);
  openSession();
})();
</script>
</body>
</html>
