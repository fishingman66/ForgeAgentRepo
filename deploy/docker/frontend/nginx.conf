server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限与后端 multipart 配置对齐
    client_max_body_size 25m;

    # gzip 静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 后端 API 代理(前端生产环境 VITE_APP_BASE_API=/prod-api)
    location /prod-api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出:关闭缓冲与压缩,长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 对外免登录入口(与 application.yml security.excludes 对齐)
    # 这些路径由外部系统直接调用(访客挂件 / 公众号·企微回调 / AICC / MCP 客户端 /
    # 工作流 API / Webhook),不会带前端的 /prod-api 前缀;若不单独代理,会被下面的
    # location / 兜底返回 index.html,导致整条链路失效。
    # proxy_pass 不带 URI 后缀,原样转发请求路径(与 /prod-api/ 的剥前缀写法不同)。
    location ~ ^/(chat-api|chat-channel|chat-voice|workflow-api|help-api|mcp|agent/trigger/webhook)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 客服逐字流式 / 坐席 SSE 同样需要关闭缓冲与压缩
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Warm-Flow 流程设计器配置接口(免登录,与 application.yml 的 security.excludes 对齐)。
    # 流程设计器 iframe 页面内部按绝对路径请求该接口(不带 /prod-api),
    # 若不单独代理会被 location / 兜底成 index.html。用 = 精确匹配:
    # nginx 优先级为「精确 > 最长前缀 > 正则」,可确保这条唯一命中。
    location = /warm-flow-ui/config {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
