# RAG 模块 - 知识库向量检索
# 本地开发直连 milvus-lite(19530 仅提供 gRPC)；生产 Milvus 3.0 standalone 同样走 gRPC。
# 两端共用 Milvus Java SDK 3.0.12 与同一套业务代码，切环境只需改 milvus-* 连接项。
# 若不想装 Milvus 可临时改 vector-store: mysql(向量列 + 应用层余弦)，切换后需回填存量分块。
rag:
  knowledge:
    vector-store: milvus
    milvus-host: 127.0.0.1
    milvus-port: 19530
    milvus-token:
    milvus-database:
    milvus-secure: false
    # lite 写入后立即可见；生产 standalone 可改 BOUNDED 降延迟
    milvus-consistency-level: STRONG
    collection-name: agent_kb_chunk
    vector-dim: 384
    file-dir: ./data/knowledge
    max-file-size-mb: 10
    milvus-timeout-ms: 10000
    # 对话 RAG:相关度阈值。只作用于可比分数(精排分/向量余弦),不作用于 RRF 融合分——
    # 早期这里配 0.01 是为了绕开"拿 RRF 分比阈值导致恒零命中"的缺陷,该缺陷已修,
    # 现在保持默认 0.05 即可(仅过滤近乎正交的噪声)。
    # 对话 RAG:多轮对话查询改写(有历史时先把用户问题改写为独立检索查询)
    query-rewrite-enabled: true
    # 对话 RAG:注入上下文 token 预算(超预算的低分命中不注入)
    rag-context-budget: 2000
    # 对话 RAG:命中分块邻块扩展(前后各补 1 个同文档分块)
    rag-neighbor-expand: true
    # 对话 RAG:检索结果缓存(仅对话链路,秒)
    rag-cache-enabled: true
    rag-cache-ttl-seconds: 60
    # MCP 检索端点(对外暴露知识库检索给 Claude Desktop/Cursor 等 MCP 客户端;默认关闭)
    # mcp-enabled: true
    # mcp-token: your-token

# P3 / M1:记忆体系六层化 —— L0 上下文预算 / L1 工作记忆 / L2 会话摘要
agent:
  chat:
    # L0:单轮上下文窗口总预算(tokens),不含输出预留
    context-window-tokens: 16000
    context-output-reserve: 2000
    history-min-tokens: 512
    history-max-turns: 40
    history-preload-limit: 80
    # L2:异步滚动摘要
    summary-enabled: true
    summary-trigger-tokens: 1500
    summary-keep-recent-messages: 4
    summary-max-chars: 800
    # L1:工具结果压缩进 run 作用域工作记忆
    working-memory-enabled: true
    working-memory-threshold-tokens: 800
    working-memory-preview-chars: 200
    working-memory-max-chars: 200000
    working-memory-max-entries: 20
    working-memory-ttl-seconds: 3600
    working-memory-recall-limit-chars: 4000
    # P3 / M3 后续:图谱辅助检索(把访客口语扩展成领域实体词再检索;只扩检索词,不动 FAQ 匹配)
    customer-service:
      kg-expand-enabled: true
      kg-expand-max-terms: 3

# P3 / M2':L3 长期记忆语义向量(MySQL 向量列,零外部依赖)
# dev 打开以联通全链路;local-hash 是特征哈希伪向量,不具备真实语义准确性,
# 生产请配 memory.vector.model 指向 agent_model 里的 OpenAI 兼容嵌入模型
memory:
  vector:
    enabled: true
    backend: mysql
    model: local-hash
    top-k: 20
    min-score: 0.2
    scan-limit: 5000
    pending-batch: 20
    semantic-weight: 0.6

  # P3 / M4:记忆治理(消息归档 + TTL + 配额淘汰;默认关,dev 开启便于验证)
  # scan-ms 必须 >0(@Scheduled 坑),开关用 enabled
  governance:
    enabled: true
    scan-ms: 600000
    archive-retention-days: 180
    archive-batch: 500
    archive-max-batches: 20
    ttl-days: 0
    default-quota: 0
    quota-evict-batch: 50

  # P3 / M3: 记忆侧只配「图谱注入」的自用参数(总开关与后端在下面的 kg.*)
  # 图谱本体已经是独立模块 forge-kg,智能客服后续可直接复用 KgService
  graph:
    inject-chars: 220
    neighbor-limit: 5
    rebuild-batch: 10
    rebuild-limit: 200

# P3 / M3: 知识图谱模块 forge-kg(开发/测试用 MySQL 两表存图,零新基建)
# 生产若要换 Neo4j 等专用图库:新增一个 backend() 返回 neo4j 的 KgStore 实现并注册为 Bean,
# 调用方(记忆/客服)与本配置项都不用改;配了未实现的后端会按关闭处理并告警一次。
kg:
  enabled: true
  backend: mysql
  scan-node-limit: 500
  max-triples-per-ingest: 6
  min-edge-weight: 1.0
